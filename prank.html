<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kena Prank 😂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Arial, sans-serif;
text-align:center;
overflow:hidden;

/* Background animasi */
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bgMove 8s infinite linear;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Emoji besar */
.big-emoji{
font-size:140px;
animation:laughShake .3s infinite alternate;
}

/* Animasi tertawa */
@keyframes laughShake{
0%{ transform:rotate(-10deg) scale(1);}
100%{ transform:rotate(10deg) scale(1.1);}
}

/* Teks */
.text{
margin-top:25px;
font-size:36px;
font-weight:bold;
color:white;
text-shadow:2px 2px 10px rgba(0,0,0,.4);
animation:bounce .7s infinite;
}

.laugh-text{
font-size:26px;
margin-top:10px;
color:#fff;
animation:flash .6s infinite;
}

/* Animasi teks */
@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-12px);}
}

@keyframes flash{
0%{opacity:1;}
50%{opacity:.3;}
100%{opacity:1;}
}

/* Emoji jatuh */
.confetti{
position:absolute;
top:-20px;
font-size:26px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

/* Responsive HP */
@media(max-width:600px){

.big-emoji{
font-size:90px;
}

.text{
font-size:24px;
}

.laugh-text{
font-size:18px;
}

}

</style>
</head>

<body>

<div class="big-emoji">🤣</div>

<div class="text">Selamat! Anda Kena Prank 😂</div>
<div class="laugh-text">WKWKWKWKWK 🤣</div>

<!-- emoji jatuh -->
<div class="confetti" style="left:10%; animation-duration:4s;">😂</div>
<div class="confetti" style="left:30%; animation-duration:6s;">🤣</div>
<div class="confetti" style="left:50%; animation-duration:5s;">😂</div>
<div class="confetti" style="left:70%; animation-duration:7s;">🤣</div>
<div class="confetti" style="left:90%; animation-duration:4s;">😂</div>

</body>
</html>
