<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kena Prank</title>

<style>
body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    text-align: center;
}

/* Judul prank */
h1{
    margin-top: 30px;
    font-size: 32px;
    color: #333;
}

/* Wajah */
.emoji {
    position: relative;
    width: 150px;
    height: 150px;
    background: #ffeb3b;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    animation: laugh 0.5s infinite alternate;
}

/* Mata kiri & kanan */
.eye {
    position: absolute;
    top: 40px;
    width: 20px;
    height: 20px;
    background: #000;
    border-radius: 50%;
}
.eye.left { left: 40px; }
.eye.right { right: 40px; }

/* Mulut */
.mouth {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 40px;
    background: #000;
    border-bottom-left-radius: 80px 40px;
    border-bottom-right-radius: 80px 40px;
    overflow: hidden;
}

/* Gigi */
.teeth {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50%;
    background: #fff;
}

/* Animasi tertawa */
@keyframes laugh {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-5px); }
}
</style>
</head>

<body>

<div class="emoji">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth">
        <div class="teeth"></div>
    </div>
</div>

<h1>😂 Selamat! Anda Kena Prank!</h1>

</body>
</html>
