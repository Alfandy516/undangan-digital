<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kena Prank 😂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:Arial, sans-serif;
text-align:center;
overflow:hidden;

/* Background animasi */
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bgMove 8s infinite linear;
}

/* Animasi background */
@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Emoji utama */
.emoji{
position:relative;
width:180px;
height:180px;
background:#ffeb3b;
border-radius:50%;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
animation:shake .25s infinite alternate;
}

/* Mata */
.eye{
position:absolute;
top:50px;
width:35px;
height:20px;
border-bottom:6px solid #000;
border-radius:50%;
}

.eye.left{left:35px;}
.eye.right{right:35px;}

/* Mulut */
.mouth{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
width:100px;
height:60px;
background:#000;
border-bottom-left-radius:100px 60px;
border-bottom-right-radius:100px 60px;
animation:laugh .3s infinite alternate;
overflow:hidden;
}

.tongue{
position:absolute;
bottom:0;
width:100%;
height:30px;
background:#ff5252;
border-radius:50%;
}

/* Animasi tertawa */
@keyframes shake{
0%{transform:rotate(-5deg);}
100%{transform:rotate(5deg);}
}

@keyframes laugh{
0%{height:55px;}
100%{height:75px;}
}

/* Teks */
.text{
margin-top:30px;
font-size:38px;
font-weight:bold;
color:white;
text-shadow:2px 2px 10px rgba(0,0,0,.4);
animation:bounce .6s infinite;
}

.laugh-text{
font-size:26px;
margin-top:10px;
color:#fff;
animation:flash .6s infinite;
}

/* Animasi teks */
@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

@keyframes flash{
0%{opacity:1;}
50%{opacity:.3;}
100%{opacity:1;}
}

/* Emoji jatuh */
.confetti{
position:absolute;
top:-20px;
font-size:22px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

/* Responsive HP */
@media(max-width:600px){

.emoji{
width:140px;
height:140px;
}

.eye{
top:40px;
width:25px;
}

.mouth{
width:80px;
height:50px;
}

.text{
font-size:26px;
}

.laugh-text{
font-size:20px;
}

}

</style>
</head>

<body>

<div class="emoji">
<div class="eye left"></div>
<div class="eye right"></div>
<div class="mouth">
<div class="tongue"></div>
</div>
</div>

<div class="text">😂 Selamat! Anda Kena Prank!</div>
<div class="laugh-text">WKWKWKWK 🤣</div>

<!-- emoji jatuh -->
<div class="confetti" style="left:10%; animation-duration:4s;">😂</div>
<div class="confetti" style="left:30%; animation-duration:6s;">🤣</div>
<div class="confetti" style="left:50%; animation-duration:5s;">😂</div>
<div class="confetti" style="left:70%; animation-duration:7s;">🤣</div>
<div class="confetti" style="left:90%; animation-duration:4s;">😂</div>

</body>
</html>
